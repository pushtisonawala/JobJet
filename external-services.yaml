apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
    targetPort: 6380
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
subsets:
- addresses:
  - ip: 172.18.0.1
  ports:
  - port: 6380
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongo
subsets:
- addresses:
  - ip: 172.18.0.1
  ports:
  - port: 27017