apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobqueue-worker2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobqueue-worker2
  template:
    metadata:
      labels:
        app: jobqueue-worker2
    spec:
      containers:
      - name: worker2
        image: jobqueue-worker2:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: MONGO_URI
          value: "mongodb://mongo:27017/jobjet"
