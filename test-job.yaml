apiVersion: batch/v1
kind: Job
metadata:
  name: email-1770131662641564100
  labels:
    jobdefinition: email-1770131662641564100
    queue: email
spec:
  template:
    metadata:
      labels:
        jobdefinition: email-1770131662641564100
        queue: email
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["sh", "-c"]
        args:
        - |
          echo "Processing email job..."
          echo "To: test1@example.com"
          echo "Subject: CLI Test 1"
          echo "Body: Testing list command"
          echo "Job completed successfully!"
          sleep 30
      restartPolicy: Never
  backoffLimit: 3
